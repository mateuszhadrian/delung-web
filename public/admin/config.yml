# ── Gdzie zapisywana jest treść ──────────────────────────────────────────
backend:
  name: github
  repo: mateuszhadrian/delung-web # właściciel/nazwa repo
  branch: main
  # Worker-logowania (OAuth proxy) — osobny deploy dla delung:
  base_url: https://auth.delung.pl
  # Bez tego panel na localhoscie wysyła site_id=cms.netlify.com (dziedzictwo
  # Netlify w Sveltii) i wpada na ALLOWED_DOMAINS Workera:
  site_domain: delung.pl

# ── Gdzie trafiają media: Cloudflare R2 ──────────────────────────────────
# Secret Access Key NIE trafia do tego pliku — Sveltia poprosi o niego
# w panelu przy pierwszym uploadzie i trzyma go w pamięci przeglądarki.
# account_id i access_key_id są jawne (autoryzuje dopiero sekret).
media_libraries:
  cloudflare_r2:
    account_id: "a1f687532595bb8659c557adba293d53"
    access_key_id: "a62e09bb76d1c9157b1705c95079be4c"
    bucket: "delung-media"
    public_url: "https://media.delung.pl" # custom domain bucketa
    prefix: "realizacje/" # pliki wewnątrz bucketa w podfolderze
    jurisdiction: "eu"

# ── Czyste JSON-y: pomijaj niewypełnione pola opcjonalne (np. liveUrl) ────
output:
  omit_empty_optional_fields: true

# ── PL-only (decyzja #2 delung): zwykłe pola, bez obiektów {pl,en} ────────
# Schemat po remoncie panelu (docs/analiza-remont-panelu.md). Zmiana zawsze w TRZECH
# miejscach naraz (src/content.schema.ts / ten plik /
# src/components/sections/work/*) — reguła cms-realizacje.
# Opcje selecta „Kategoria" = slugi z src/lib/categories.ts (D2);
# spójności pilnuje test kontraktu (tests/unit/cms-contract.test.ts).

collections:
  - name: "realizacje"
    label: "Realizacje"
    label_singular: "Realizacja"
    folder: "src/content/realizacje" # tu leżą pliki JSON kolekcji
    extension: "json"
    format: "json"
    create: true # pozwól DODAWAĆ nowe realizacje
    delete: true # pozwól USUWAĆ realizacje
    identifier_field: "title" # co pokazać na liście wpisów
    slug: "{{fields.slug}}" # nazwa pliku = wartość pola slug
    summary: "{{fields.title}} ({{fields.year}})"
    fields:
      - {
          label: "Slug (adres, np. kuchnia-kaszmirowa)",
          name: "slug",
          widget: "string",
        }
      - {
          label: "Kolejność (mniejsze = wyżej)",
          name: "order",
          widget: "number",
          value_type: "int",
          default: 10,
        }
      - { label: "Tytuł", name: "title", widget: "string" }
      - label: "Kategoria"
        name: "category"
        widget: "select"
        options:
          # slugi + etykiety 1:1 z src/lib/categories.ts (test kontraktu!)
          - { label: "Kuchnie", value: "kuchnie" }
          - { label: "Szafy i garderoby", value: "szafy-garderoby" }
          - { label: "Wnętrza komercyjne i biura", value: "wnetrza-komercyjne" }
          - { label: "Dekoracje okienne", value: "dekoracje-okienne" }
          - { label: "Zabudowy łazienkowe", value: "zabudowy-lazienkowe" }
          - { label: "Meble nietypowe", value: "meble-nietypowe" }
          - { label: "Inne", value: "inne" }
      - { label: "Rok realizacji", name: "year", widget: "string" }
      - { label: "Opis", name: "description", widget: "text" }

      # ── Galeria detalu ────────────────────────────────────────────────
      # Osobnego pola „Kafel (cover)" NIE MA (remont panelu, D-RP2): kaflem
      # realizacji jest PIERWSZA pozycja galerii — dlatego musi być zdjęciem
      # (pilnuje tego schemat Zod, panel nie umie warunku „na tej pozycji").
      # Pozycja to WARIANT: albo zdjęcie, albo film — nigdy oba naraz (D-RP1).
      # Wariantami steruje `types` Sveltii; klucz `type` w JSON-ie dopisuje
      # sam panel. „Zdjęcie" stoi pierwsze celowo: domyślny wybór ma być
      # poprawny także na pozycji nr 1.
      - label: "Galeria (pierwsza pozycja = kafel na liście)"
        name: "gallery"
        widget: "list"
        label_singular: "Pozycja galerii"
        min: 1 # schemat Zod wymaga ≥1 pozycji
        types:
          - label: "Zdjęcie"
            name: "photo"
            summary: "{{fields.image}}"
            fields:
              - { label: "Zdjęcie", name: "image", widget: "image" }
              - {
                  label: "Kadr (object-position, np. 50% 42%)",
                  name: "position",
                  widget: "string",
                  required: false,
                }
          - label: "Film"
            name: "video"
            summary: "{{fields.video}}"
            fields:
              - {
                  # Plan A ze spike'a Etapu 2: widget file wgrywa MP4 do R2.
                  # Limity: H.264+AAC, 1080p, ≤ ~30 MB (reguła cms-realizacje).
                  label: "Wideo MP4 (miniatura powstanie sama z klatki filmu)",
                  name: "video",
                  widget: "file",
                }
              - {
                  # Podwójna rola: podpis przy znaczku play ORAZ środek filmu,
                  # z którego wycinana jest miniatura. Puste = klatka z 1 s.
                  label: "Długość wideo (np. 0:24 — podpis i środek miniatury)",
                  name: "duration",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Kadr (object-position, np. 50% 42%)",
                  name: "position",
                  widget: "string",
                  required: false,
                }

      # ── Tabela parametrów detalu ──
      - label: "Parametry (specs)"
        name: "specs"
        widget: "list"
        label_singular: "Parametr"
        summary: "{{fields.label}}"
        fields:
          - {
              label: "Etykieta (np. MATERIAŁY / BLAT / ZAKRES)",
              name: "label",
              widget: "string",
            }
          - { label: "Wartość", name: "value", widget: "string" }
