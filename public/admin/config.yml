# ── Gdzie zapisywana jest treść ──────────────────────────────────────────
backend:
  name: github
  repo: mateuszhadrian/delung-web # właściciel/nazwa repo
  branch: main
  # Worker-logowania (OAuth proxy) — osobny deploy dla delung, wdrażany
  # w Etapie 2 (docelowo custom domain auth.delung.pl):
  base_url: https://auth.delung.pl

# ── Gdzie trafiają media: Cloudflare R2 (Etap 2) ──────────────────────────
# Secret Access Key NIE trafia do tego pliku — Sveltia poprosi o niego
# w panelu przy pierwszym uploadzie i trzyma go w pamięci przeglądarki.
# account_id / access_key_id uzupełniane po utworzeniu bucketa i tokenu R2
# (Etap 2.1) — placeholdery celowo niepodobne do prawdziwych wartości.
media_libraries:
  cloudflare_r2:
    account_id: "TODO_ACCOUNT_ID"
    access_key_id: "TODO_ACCESS_KEY_ID"
    bucket: "delung-media"
    public_url: "https://media.delung.pl" # custom domain bucketa
    prefix: "realizacje/" # pliki wewnątrz bucketa w podfolderze
    jurisdiction: "eu"

# ── Czyste JSON-y: pomijaj niewypełnione pola opcjonalne (np. liveUrl) ────
output:
  omit_empty_optional_fields: true

# ── PL-only (decyzja #2 delung): zwykłe pola, bez obiektów {pl,en} ────────
# UWAGA: przejściowy kształt odziedziczony z szablonu źródłowego; docelowy schemat
# delung (category select z categories.ts, cover, gallery z wideo, specs)
# wchodzi w Etapie 2 — zmiana zawsze w TRZECH miejscach naraz
# (src/content.schema.ts / ten plik / src/components/sections/work/*).

collections:
  - name: "realizacje"
    label: "Realizacje"
    label_singular: "Realizacja"
    folder: "src/content/realizacje" # tu leżą pliki JSON kolekcji
    extension: "json"
    format: "json"
    create: true # pozwól DODAWAĆ nowe realizacje
    delete: true # pozwól USUWAĆ realizacje
    identifier_field: "name" # co pokazać na liście wpisów
    slug: "{{fields.slug}}" # nazwa pliku = wartość pola slug
    summary: "{{fields.name}} ({{fields.year}})"
    fields:
      - { label: "Slug (adres, np. aura)", name: "slug", widget: "string" }
      - {
          label: "Kolejność (mniejsze = wyżej)",
          name: "order",
          widget: "number",
          value_type: "int",
          default: 10,
        }
      - { label: "Nazwa", name: "name", widget: "string" }
      - { label: "Rok", name: "year", widget: "string" }
      - { label: "Kategoria", name: "category", widget: "string" }
      - { label: "Krótki opis (blurb)", name: "blurb", widget: "text" }

      # min/max — strona pokazuje maks. 3 tagi (limit zgodny ze schematem Zod
      # .max(3)); `min` w parze, bo w Decap/Sveltii `max` bez `min` bywa ignorowane
      - {
          label: "Tagi (maks. 3)",
          name: "tags",
          widget: "list",
          min: 1,
          max: 3,
          field: { label: "Tag", name: "tag", widget: "string" },
        }

      - { label: "Wprowadzenie (intro)", name: "intro", widget: "text" }

      # ── Ekrany: lista, każdy ma DWA zrzuty (desktop + mobile) ──
      - label: "Ekrany (podgląd na urządzeniach)"
        name: "screens"
        widget: "list"
        label_singular: "Ekran"
        min: 1 # schemat Zod wymaga ≥1 ekranu; kafelek bierze obraz z ekranu „home"
        summary: "{{fields.label}}"
        fields:
          - {
              label: "Klucz (home/gallery/order)",
              name: "key",
              widget: "string",
            }
          - { label: "Etykieta", name: "label", widget: "string" }
          - { label: "Zrzut DESKTOP", name: "desktop", widget: "image" }
          - { label: "Zrzut MOBILE", name: "mobile", widget: "image" }

      # ── Liczby i wyniki ──
      - label: "Wyniki (liczby)"
        name: "results"
        widget: "list"
        label_singular: "Wynik"
        fields:
          - { label: "Metryka", name: "metric", widget: "string" }
          - { label: "Opis", name: "label", widget: "string" }

      # ── Opinia ──
      - { label: "Cytat / opinia", name: "quote", widget: "text" }
      - { label: "Autor opinii", name: "author", widget: "string" }
      - { label: "Rola autora", name: "role", widget: "string" }

      # ── Zakres prac ──
      - {
          label: "Zakres prac (scope)",
          name: "scope",
          widget: "list",
          field: { label: "Punkt", name: "item", widget: "string" },
        }

      - {
          label: "Link do strony na żywo (opcjonalny)",
          name: "liveUrl",
          widget: "string",
          required: false,
        }
